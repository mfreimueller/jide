name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, install and smoke-test, but do not publish"
        type: boolean
        default: true
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./app/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app/package.json version ${v}"; exit 1
          fi
      - name: API URL is set
        shell: bash
        env:
          JIDE_API_URL: ${{ vars.JIDE_API_URL }}
        run: |
          if [ -z "$JIDE_API_URL" ]; then
            echo "Repository variable JIDE_API_URL is empty. Set it under Settings > Secrets and variables > Actions > Variables."; exit 1
          fi
      - run: npm ci
      - run: npm run build -w java-helper
      - run: npm run runtime -w app
      - run: npm run verify-runtime -w app
      - name: Build installer (not published)
        working-directory: app
        env:
          JIDE_API_URL: ${{ vars.JIDE_API_URL }}
        run: npx electron-vite build && npx electron-builder --win nsis --x64 --publish never
      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/dist/JDE-Setup-*.exe | Select-Object -First 1
          "Installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\JDE\JDE.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1; throw "JDE.exe not found at $exe" }
          "JDE_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          foreach ($d in @([Environment]::GetFolderPath("Desktop"), "$env:APPDATA\Microsoft\Windows\Start Menu\Programs")) {
            if (-not (Test-Path (Join-Path $d "J;DE.lnk"))) { throw "shortcut J;DE.lnk missing in $d" }
          }
      - name: Smoke test the installed app
        shell: pwsh
        run: |
          $env:JIDE_SMOKE = "1"
          $env:JIDE_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP "jde-smoke"
          $out = Join-Path $env:RUNNER_TEMP "smoke.out"
          $err = Join-Path $env:RUNNER_TEMP "smoke.err"
          $p = Start-Process -FilePath $env:JDE_EXE -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Get-Content $out, $err; throw "smoke: timeout" }
          Get-Content $out, $err
          if (-not ((Get-Content $out -Raw) -match "JIDE_SMOKE_READY")) { throw "smoke: JIDE_SMOKE_READY not printed" }
      - name: Bundled JDK works in the installed app
        shell: pwsh
        run: |
          $java = Join-Path (Split-Path $env:JDE_EXE) "resources\jdk\bin\java.exe"
          & $java -version
          if ($LASTEXITCODE -ne 0) { throw "bundled java failed" }
          if (-not (Test-Path (Join-Path (Split-Path $env:JDE_EXE) "resources\java-helper.jar"))) { throw "helper jar missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            app/dist/JDE-Setup-*.exe
            app/dist/JDE-Setup-*.exe.blockmap
            app/dist/latest.yml
          if-no-files-found: error

  # Linux AppImage (x64), built and smoke-tested on ubuntu-latest (Ubuntu 24.04); never publishes.
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./app/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app/package.json version ${v}"; exit 1
          fi
      - name: API URL is set
        env:
          JIDE_API_URL: ${{ vars.JIDE_API_URL }}
        run: |
          if [ -z "$JIDE_API_URL" ]; then
            echo "Repository variable JIDE_API_URL is empty. Set it under Settings > Secrets and variables > Actions > Variables."; exit 1
          fi
      - run: npm ci
      - run: npm run build -w java-helper
      - run: npm run runtime -w app
      - run: npm run verify-runtime -w app
      - name: Build AppImage (not published)
        working-directory: app
        env:
          JIDE_API_URL: ${{ vars.JIDE_API_URL }}
        run: npx electron-vite build && npx electron-builder --linux AppImage --x64 --publish never
      - name: Allow Chromium's sandbox (Ubuntu 24.04 runner)
        # AppArmor blocks unprivileged user namespaces on Ubuntu 24.04 (CI only, same remedy as
        # Playwright's Electron CI). Without it AppRun would start the app with --no-sandbox.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Smoke test the AppImage
        # --appimage-extract-and-run: no FUSE 2 needed on the runner (libfuse2 is not preinstalled)
        run: |
          files=("$GITHUB_WORKSPACE"/app/dist/JDE-*.AppImage)
          appimage="${files[0]}"
          echo "AppImage: $appimage ($(du -m "$appimage" | cut -f1) MB)"
          chmod +x "$appimage"
          export JIDE_SMOKE=1 JIDE_USER_DATA_DIR="$RUNNER_TEMP/jde-smoke"
          set +e
          timeout 60 xvfb-run -a "$appimage" --appimage-extract-and-run > "$RUNNER_TEMP/smoke.out" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/smoke.out"
          if [ "$code" = 124 ]; then echo "smoke: timeout"; exit 1; fi
          grep -q JIDE_SMOKE_READY "$RUNNER_TEMP/smoke.out" || { echo "smoke: JIDE_SMOKE_READY not printed"; exit 1; }
      - name: Bundled JDK works in the AppImage
        run: |
          files=("$GITHUB_WORKSPACE"/app/dist/JDE-*.AppImage)
          appimage="${files[0]}"
          mkdir "$RUNNER_TEMP/extract" && cd "$RUNNER_TEMP/extract"
          "$appimage" --appimage-extract > /dev/null
          squashfs-root/resources/jdk/bin/java -version
          test -f squashfs-root/resources/java-helper.jar || { echo "helper jar missing"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            app/dist/JDE-*.AppImage
            app/dist/latest-linux.yml
          if-no-files-found: error

  # Exam folder (unpacked app for the Angabelaufwerk), smoke-tested from a read-only folder.
  exam:
    uses: ./.github/workflows/exam-build.yml
    permissions:
      contents: read

  # Publishes exactly the files that were installed and smoke-tested above.
  publish:
    needs: [build, build-linux, exam]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: JDE-Exam
          path: installer
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l installer
          gh release create "$GITHUB_REF_NAME" installer/JDE-Setup-*.exe installer/JDE-Setup-*.exe.blockmap installer/latest.yml \
            installer/JDE-*.AppImage installer/latest-linux.yml installer/JDE-Exam-*.zip \
            --title "J;DE ${GITHUB_REF_NAME#v}" --generate-notes
