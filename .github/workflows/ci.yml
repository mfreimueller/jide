name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  # Builds the installer, installs it silently and smoke-tests it; never publishes.
  installer:
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
    permissions:
      contents: write

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w java-helper
      - run: npm run typecheck --if-present -w shared -w app -w java-helper
      - run: npm test --if-present -w shared -w java-helper -w app
      - name: e2e
        run: npm run test:e2e
      - name: Upload e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: app/test-results
          if-no-files-found: ignore
      - name: Bundled runtime (jlink) check
        run: |
          npm run runtime -w app
          npm run verify-runtime -w app
      - name: e2e against the bundled runtime
        run: npm run test:e2e
        env:
          JAVA_HOME: ${{ github.workspace }}/app/build/jdk

  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: jide
          MARIADB_USER: jide
          MARIADB_PASSWORD: jide
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w backend
      - run: npm test -w backend
