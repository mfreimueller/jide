appId: io.github.mfreimueller.jide
productName: JDE
copyright: J;DE
# electron-builder derives the per-user install folder from the npm package name ("@jide/app" ->
# "@jideapp"). Override it in the packaged app only; userData stays "JDE" (productName).
extraMetadata:
  name: jde
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: build/jdk
    to: jdk
  - from: ../java-helper/target/java-helper.jar
    to: java-helper.jar
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.ico
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "J;DE"
  artifactName: JDE-Setup-${version}.exe
publish:
  provider: github
  owner: mfreimueller
  repo: jide
  releaseType: release
