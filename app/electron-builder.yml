appId: io.github.mfreimueller.jide
productName: JDE
copyright: J;DE
# electron-builder derives the per-user install folder from the npm package name ("@jide/app" ->
# "@jideapp"). Override it in the packaged app only; userData stays "JDE" (productName).
extraMetadata:
  name: jde
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: build/jdk
    to: jdk
  - from: ../java-helper/target/java-helper.jar
    to: java-helper.jar
# jide://practice?src=... links from the course page (registered by the installer / app bundle)
protocols:
  name: "J;DE"
  schemes:
    - jide
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.ico
linux:
  target:
    - target: AppImage
      arch: x64
  icon: resources/icon.png
  category: Education
  # Keep the Chromium sandbox: no --no-sandbox in the embedded desktop entry (electron-builder adds it by default).
  executableArgs: []
  artifactName: JDE-${version}.AppImage
  # The app copies this icon to ~/.local/share/icons for the jide:// desktop entry (linux-deep-link.ts).
  extraResources:
    - from: resources/icon.png
      to: icon.png
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "J;DE"
  artifactName: JDE-Setup-${version}.exe
publish:
  provider: github
  owner: mfreimueller
  repo: jide
  releaseType: release
